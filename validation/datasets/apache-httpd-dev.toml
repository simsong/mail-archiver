schema_version = 1
id = "apache-httpd-dev"
title = "Apache httpd-dev Mailing List Sample"
homepage = "https://lists.apache.org/list.html?dev@httpd.apache.org"
availability_note = "A fixed three-month cross-era sample keeps this validation run bounded."
max_unpacked_bytes = 5368709120

[preprocess]
kind = "mailboxes"
include = ["*"]

[aws]
instance_type = "m7i.large"
volume_size_gib = 30

[[sources]]
