name: Assemble draft GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed annotated tag, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Verify annotated tag and project version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run python scripts/release_tag.py --tag "$RELEASE_TAG" --require-annotated
      - name: Verify tag signature
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Write checksums
        run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --draft \
            --title "Mail Archiver $RELEASE_TAG" \
            --generate-notes \
            dist/*
