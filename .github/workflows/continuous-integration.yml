name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav-daemon
          sudo systemctl stop clamav-daemon clamav-freshclam
          sudo freshclam
          sudo chmod -R a+rX /var/lib/clamav
          mkdir -p "${RUNNER_TEMP}/mailarchiver-clamav"
          {
            echo 'MAILARCHIVER_CLAMD=/usr/sbin/clamd'
            echo 'MAILARCHIVER_CLAMDSCAN=/usr/bin/clamdscan'
            echo "MAILARCHIVER_CLAMD_CONFIG=${RUNNER_TEMP}/mailarchiver-clamav/clamd.conf"
            echo "MAILARCHIVER_CLAMD_SOCKET=${RUNNER_TEMP}/mailarchiver-clamav/clamd.sock"
          } >> "${GITHUB_ENV}"
          printf '%s\n' \
            'DatabaseDirectory /var/lib/clamav' \
            "LocalSocket ${RUNNER_TEMP}/mailarchiver-clamav/clamd.sock" \
            "PidFile ${RUNNER_TEMP}/mailarchiver-clamav/clamd.pid" \
            > "${RUNNER_TEMP}/mailarchiver-clamav/clamd.conf"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Pytest
        run: make check

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Pylint
        run: make pylint
