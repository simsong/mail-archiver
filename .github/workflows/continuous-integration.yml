name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --yes clamav-daemon
          sudo systemctl stop clamav-daemon clamav-daemon.socket clamav-freshclam
          sudo freshclam
          sudo chmod -R a+rX /var/lib/clamav
          sudo install -d -o "$(id -u)" -g "$(id -g)" /run/clamav
          mkdir -p "${RUNNER_TEMP}/mailarchiver-clamav"
          {
            echo 'MAILARCHIVER_CLAMD=/usr/sbin/clamd'
            echo 'MAILARCHIVER_CLAMDSCAN=/usr/bin/clamdscan'
            echo "MAILARCHIVER_CLAMD_CONFIG=${RUNNER_TEMP}/mailarchiver-clamav/clamd.conf"
            echo 'MAILARCHIVER_CLAMD_SOCKET=/run/clamav/clamd.ctl'
          } >> "${GITHUB_ENV}"
          printf '%s\n' \
            'DatabaseDirectory /var/lib/clamav' \
            "User $(id -un)" \
            'LocalSocket /run/clamav/clamd.ctl' \
            'PidFile /run/clamav/clamd.pid' \
            > "${RUNNER_TEMP}/mailarchiver-clamav/clamd.conf"
      - name: Smoke-test on-demand ClamAV
        shell: bash
        run: |
          "$MAILARCHIVER_CLAMD" --foreground --config-file="$MAILARCHIVER_CLAMD_CONFIG" &
          clamd_pid=$!
          trap 'kill "$clamd_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if [[ -S "$MAILARCHIVER_CLAMD_SOCKET" ]]; then
              break
            fi
            if ! kill -0 "$clamd_pid" 2>/dev/null; then
              wait "$clamd_pid"
              exit 1
            fi
            sleep 1
          done
          test -S "$MAILARCHIVER_CLAMD_SOCKET"
          "$MAILARCHIVER_CLAMDSCAN" --config-file="$MAILARCHIVER_CLAMD_CONFIG" --ping=10
          kill "$clamd_pid"
          wait "$clamd_pid"
          trap - EXIT
          rm -f "$MAILARCHIVER_CLAMD_SOCKET" /run/clamav/clamd.pid
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install headless test browser
        run: make install-test-browser PLAYWRIGHT_INSTALL_ARGS="--with-deps chromium"
      - name: Pytest
        run: make check

  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Pylint
        run: make pylint

  native-gui-e2e:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Native UI bridge smoke test
        id: native-smoke
        continue-on-error: true
        env:
          MAILARCHIVER_NATIVE_GUI_ARTIFACT_DIR: ${{ runner.temp }}/native-gui-diagnostics
        run: make test-native-gui
      - name: Upload native GUI diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-gui-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-gui-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - name: Report native GUI advisory result
        if: always()
        env:
          NATIVE_SMOKE_OUTCOME: ${{ steps.native-smoke.outcome }}
        shell: bash
        run: |
          echo "Native GUI smoke outcome: **${NATIVE_SMOKE_OUTCOME}**" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${NATIVE_SMOKE_OUTCOME}" != success ]]; then
            echo '::warning title=Native GUI advisory failed::See the native-gui-diagnostics artifact for the phase report and any process sample.'
          fi
