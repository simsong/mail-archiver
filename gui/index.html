<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; frame-src blob: data:; object-src 'none'; connect-src 'self'">
    <title>Mail Archiver</title>
    <link rel="stylesheet" href="vendor/tabulator/dist/css/tabulator.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="app">
      <header class="toolbar no-print">
        <button id="choose-archive" type="button">Open Archive…</button>
        <form id="search-form" role="search">
          <div id="search-control" class="search-control">
            <div id="search-filters" class="search-filters"></div>
            <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder='Search mail — from:alice@example.com subject:"annual report"' aria-autocomplete="list" aria-controls="search-suggestions">
            <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div>
          </div>
        </form>
        <label class="attachment-search"><input id="search-attachments" type="checkbox"> Search attachments</label>
        <label class="attachment-search"><input id="show-original-folders" type="checkbox"> Show original folder structure</label>
        <span id="archive-label"></span>
      </header>

      <section class="workspace">
        <aside id="mailbox-browser" class="mailbox-browser no-print" hidden>
          <h2>Original mailboxes</h2>
          <div class="mailbox-controls">
            <label for="filter-set">Filter set:</label>
            <select id="filter-set" aria-label="Original-mailbox filter set">
              <option value="">None</option>
              <option value="__save__">Save...</option>
            </select>
            <button id="manage-filter-sets" type="button" aria-label="Manage filter sets">...</button>
          </div>
          <label class="volume-toggle"><input id="show-source-volumes" type="checkbox"> Show source volumes</label>
          <div id="mailbox-tree" role="tree" aria-label="Original mailboxes" aria-multiselectable="true"></div>
        </aside>
        <aside id="results-pane" class="results no-print">
          <div class="result-controls">
            <div id="result-status" class="status">Use File → New or Open to begin.</div>
            <label for="sort-by">Sort:</label>
            <select id="sort-by" aria-label="Sort messages by">
              <option value="date">Date</option>
              <option value="subject">Subject</option>
              <option value="sender">Sender</option>
            </select>
            <button id="sort-direction" type="button" aria-label="Sort descending" title="Sort descending">↓</button>
          </div>
          <div id="result-list" aria-label="Search results"></div>
          <div id="result-help" hidden></div>
          <template id="search-help-template">
            <section class="search-help" aria-label="Search language help">
              <h2>Search the archive</h2>
              <p>Every search covers the complete archive. Separate terms are combined with AND; use quotes for a phrase.</p>
              <table>
                <thead><tr><th>Search form</th><th>Example</th></tr></thead>
                <tbody>
                  <tr><td>Full text</td><td><code>mit-charon</code></td></tr>
                  <tr><td>Phrase</td><td><code>"annual report"</code></td></tr>
                  <tr><td><code>any:</code> sender or recipient</td><td><code>any:alice@example.org</code></td></tr>
                  <tr><td><code>from:</code> sender</td><td><code>from:alice@example.org budget</code></td></tr>
                  <tr><td><code>to:</code> To recipient</td><td><code>to:bob@example.org</code></td></tr>
                  <tr><td><code>cc:</code> Cc recipient</td><td><code>cc:bob@example.org</code></td></tr>
                  <tr><td><code>bcc:</code> Bcc recipient</td><td><code>bcc:bob@example.org</code></td></tr>
                  <tr><td><code>subject:</code> subject text</td><td><code>subject:"annual report"</code></td></tr>
                  <tr><td><code>date:</code> UTC date</td><td><code>date:1985-10-07</code></td></tr>
                  <tr><td><code>before:</code> excludes date</td><td><code>before:1990-01-01</code></td></tr>
                  <tr><td><code>after:</code> excludes date</td><td><code>after:1980-12-31</code></td></tr>
                </tbody>
              </table>
              <p>Combine operators and text: <code>from:alice@example.org after:1984-01-01 preservation</code></p>
              <p>Select <strong>Search attachments</strong> to include indexed text attachments.</p>
            </section>
          </template>
        </aside>

        <article class="message" id="message-pane">
          <div id="message-content" hidden>
            <div class="message-actions no-print">
              <select id="part-select" aria-label="Message part"></select>
              <form id="message-find" class="message-find" role="search" hidden>
                <input id="message-find-query" type="search" autocomplete="off" spellcheck="false" aria-label="Find in message" placeholder="Find in message">
                <span id="message-find-status" aria-live="polite"></span>
                <button id="message-find-previous" type="button" aria-label="Previous match" title="Previous match">‹</button>
                <button id="message-find-next" type="submit" aria-label="Next match" title="Next match">›</button>
                <button id="message-find-close" type="button" aria-label="Close find" title="Close find">×</button>
              </form>
              <button id="remote-content" type="button" hidden>Load Remote Content</button>
              <button id="copy-message-text" type="button" aria-label="Copy displayed message text" title="Copy displayed message text">⧉</button>
              <button id="save-message" type="button">Save Message…</button>
              <button id="print-message" type="button">Print…</button>
            </div>
            <div id="message-well">
              <div id="computed-date-banner" class="computed-date-banner" role="status" hidden></div>
              <section id="message-selection-summary" class="message-selection-summary" role="status" aria-live="polite" hidden></section>
              <div class="message-summary">
                <div class="message-heading">
                  <h1 id="message-subject"></h1>
                  <dl id="message-headers"></dl>
                </div>
                <div id="message-file-well" class="message-file-well no-print" draggable="true" title="Drag this message to Finder; the first drag prepares its temporary file" role="img" aria-label="Drag message file to Finder">
                  <span class="message-file-icon" aria-hidden="true">✉︎</span>
                  <span id="message-file-name">Message.eml</span>
                </div>
              </div>
              <div id="body-view"></div>
              <section id="attachment-section" class="attachments no-print" hidden>
                <h2>Attachments</h2>
                <div id="attachment-list"></div>
                <div id="attachment-preview"></div>
              </section>
              <section id="provenance-section" class="provenance">
                <h2>Locations</h2>
                <dl id="message-locations"></dl>
              </section>
            </div>
          </div>
        </article>
      </section>
      <button id="ingest-status-line" class="ingest-status-line no-print" type="button" hidden></button>
      <div id="error" role="alert" hidden></div>
      <dialog id="link-dialog">
        <form method="dialog">
          <h2>Open external link?</h2>
          <p id="link-destination" class="link-destination"></p>
          <div class="dialog-actions">
            <button id="link-ignore" type="submit">Ignore</button>
            <button id="link-copy" type="button">Copy Link</button>
            <button id="link-open" type="button">Open Link</button>
          </div>
        </form>
      </dialog>
      <dialog id="save-filter-dialog">
        <form id="save-filter-form">
          <h2>Save Filter Set</h2>
          <label>Name <input id="filter-set-name" required autocomplete="off"></label>
          <div class="dialog-actions">
            <button id="cancel-save-filter" type="button">Cancel</button>
            <button type="submit">Save</button>
          </div>
        </form>
      </dialog>
      <dialog id="manage-filter-dialog">
        <div class="filter-manager">
          <h2>Filter Sets</h2>
          <div id="filter-set-list"></div>
          <div class="dialog-actions"><button id="close-filter-manager" type="button">Close</button></div>
        </div>
      </dialog>
    </main>
    <script src="vendor/tabulator/dist/js/tabulator.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
