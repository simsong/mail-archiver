[project]
name = "mailarchiver"
version = "0.0.0"
description = "Personal MBOX archive normalizer"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "py7zr>=1.0.0",
    "pydantic>=2.13.4",
    "pywebview>=6.2",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",
]

[project.scripts]
mailarchiver = "mailarchiver.__main__:main"
mailsearch = "mailarchiver.mailsearch:main"
mailsearch-gui = "mailarchiver.gui_app:main"
summarize = "mailarchiver.aisummarize:main"
verify-mail-archive = "mailarchiver.standalone_verify:main"
mailarchiver-validation = "mailarchiver.validation:main"
extract-pdf-mail = "mailarchiver.pdf_mail:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailarchiver = [
    "*.yaml",
    "*.swift",
    "sql/*.sql",
    "plugins/sources/*/plugin.toml",
    "plugins/files/*/plugin.toml",
]

[dependency-groups]
dev = [
    "pylint>=3.3",
    "pytest>=8.0",
    "pytest-playwright>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.pylint."messages control"]
disable = ["C", "R", "W", "no-member"]
